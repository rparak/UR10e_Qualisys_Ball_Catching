## =========================================================================== ##
#   Description:
#     The training configuration of the ball-catching simulation (SPEC §8.3; F7, F8).
#     Read only by src/Configuration/Core.py (Load_Training_Configuration); written by hand. Given to
#     scripts/catch.py train through --config; a copy is stored with every run.
#     This file trains the final learned predictor (F8; F14; owner, 2026-11-18, Q1): the query-time model with the
#     basis decoder, on the mix of five noise scales of the same throws, without early stopping, with the position
#     loss, one model per seed (SPEC §4.8, §7.8).
#     The numerical predictor (Model.Name GLS_M4, F7) needs the sections Run (Name, Datasets), Input, Model
#     (Name) and Output only: the learning fields below cannot take effect for it and are named in one WARNING.
#
#   REQUIRED: every field is required for a learned predictor; a missing or invalid field fails the load, naming it.
#   Units: in brackets after each field's comment.
#   Paths: repository-relative.
## =========================================================================== ##

# The run: its name, the datasets it is scored on, its training seeds and its device.
Run:
  # The run's folder under Output.Folder; letters, digits, _ and - only. Source: the user. [-] REQUIRED.
  Name: QT_BASIS
  # The datasets evaluate scores the run on, each its folder and the SHA-256 of its flights.npz (from its
  # manifest.json); a run is refused when a dataset's flights.npz has another hash. Default is Config/dataset.yaml
  # (seed 20261111); Noise_<s> is the same file with Dataset.Name and Observation.Noise.Scale changed (0, 0.25, 0.5
  # and 1.5: the same throws and dropouts, the error scaled). The first dataset's configuration gives the support
  # that 'evaluate --partition test' checks the real flights against (SPEC §2.13.6). Source: the datasets' manifests (scripts/catch.py
  # dataset at commit 6be743d, 2026-11-16, and for Noise_0 and Noise_0_25 at F8, 2026-11-17: the error model
  # bounded and the targets in Throw.Target_Area; owner, 2026-11-15). [path], [hex] REQUIRED.
  Datasets:
    - Path: Data/Generated/Datasets/Default
      Hash: 916ea9fcdefb246d5da94119b73dac6446792bd6a81a214c1c53f9edf6b8b74a
    - Path: Data/Generated/Datasets/Noise_0
      Hash: 19a03de242871cf0a782da540849e9ffa1be08b20fa0e7cd952990f4f273d776
    - Path: Data/Generated/Datasets/Noise_0_25
      Hash: e293dae46955adc8c56fa065dedb3d6a6059efa66d3b12bb0be9f32ba9437dc0
    - Path: Data/Generated/Datasets/Noise_0_5
      Hash: 847b46c242b5bbd801963d010b1148f96984e990a83ce19193ae1ae1cf681c06
    - Path: Data/Generated/Datasets/Noise_1_5
      Hash: f6c48e2acd7b4a9e88670b48a3f56f618bedc37b81b0cac4b9e6978f6b278d68
  # The training seeds, at least 5 distinct integers >= 0 (SPEC §2.13.7): one model each. A seed fixes the initial
  # weights and, per epoch, the prefixes, their N, their order and their query times; it never changes the data.
  # Source: SPEC §8.3. [-] REQUIRED.
  Seeds: [0, 1, 2, 3, 4]
  # cpu or mps. Every reported number comes from the CPU (one thread, deterministic: the same seed gives the same
  # weights bit for bit); mps serves tuning sweeps only, and evaluate --partition test refuses a run trained on it. Source: owner,
  # 2026-11-10, Q9; 2026-11-17, Q15. [-] REQUIRED.
  Device: cpu

# The input of a prediction.
Input:
  # The values of N: a prefix is the first N observed samples of a flight (with the first 40 ms of a real
  # flight trimmed); a flight with fewer samples is left out and counted. A learned predictor is one model for
  # every N: it is trained on prefixes of every N from the smallest to the largest value here (owner, 2026-11-17,
  # Q4) and scored at these values. Distinct integers >= 2. Source: assumed (SPEC §8.3). [-] REQUIRED.
  Observed_Samples: [10, 20, 40]

# The predictor.
Model:
  # The learned predictor QT_BASIS (the query-time model: an encoder of the prefix and a Chebyshev basis of degree 6
  # per axis as decoder, which returns the state at any time directly), or the numerical one, GLS_M4 (SPEC §7.7,
  # §7.8; owner, 2026-11-14, F7 Q3; 2026-11-17, F8 Q1). The two predictors of the program (owner, 2026-11-22): LS,
  # QT_MLP and HYBRID were removed and are refused. [-] REQUIRED.
  Name: QT_BASIS
  # The size of the encoder's state; the layers after it are twice as wide. Source: F8 Part A's pilots (128 for
  # the query-time model), kept by F14: a state of 256 gained 0.10 mm at N = 40 for twice the
  # training time (owner, 2026-11-18, Q3: no tuning; SPEC §4.8). [-] REQUIRED.
  Hidden: 128

# The training data.
Training:
  # The datasets trained on, as Run.Datasets names them: their train partitions are pooled, and their validation
  # partitions stop the training. Listing datasets of several noise scales of the same throws is the domain
  # randomisation of SPEC §7.8 (owner, 2026-11-17, Q8): here the five scales 0, 0.25, 0.5, 1.0 and 1.5, which
  # lower the predictor's own error on error-free input from 6.4 / 2.8 / 2.4 to 1.3 / 0.8 / 0.9 mm at no cost at
  # scale 1.0 (owner, 2026-11-18, Q1; SPEC §4.8). The order is part of the run: the flights are pooled in it.
  # Source: the datasets' manifests. [path], [hex] REQUIRED.
  Datasets:
    - Path: Data/Generated/Datasets/Noise_0
      Hash: 19a03de242871cf0a782da540849e9ffa1be08b20fa0e7cd952990f4f273d776
    - Path: Data/Generated/Datasets/Noise_0_25
      Hash: e293dae46955adc8c56fa065dedb3d6a6059efa66d3b12bb0be9f32ba9437dc0
    - Path: Data/Generated/Datasets/Noise_0_5
      Hash: 847b46c242b5bbd801963d010b1148f96984e990a83ce19193ae1ae1cf681c06
    - Path: Data/Generated/Datasets/Default
      Hash: 916ea9fcdefb246d5da94119b73dac6446792bd6a81a214c1c53f9edf6b8b74a
    - Path: Data/Generated/Datasets/Noise_1_5
      Hash: f6c48e2acd7b4a9e88670b48a3f56f618bedc37b81b0cac4b9e6978f6b278d68
  # The training flights taken from each dataset, the first of its train partition, >= 1; train refuses more than
  # a train partition holds. Source: 7000, the whole train partition of a 10 000-flight dataset (the learning
  # curve of SPEC §4.8 lowers it). [-] REQUIRED.
  Flights: 7000

# The loss: the mean over the prefixes of the RMS position error over the remainder of the flight.
Loss:
  # The weight of the velocity term added to it (the RMS error of the predicted velocity against the exact
  # simulated velocity), >= 0; 0 is the position loss alone. Source: 0, the default (owner, 2026-11-17, Q5); the
  # measured velocity-loss variant and its weight are in SPEC §4.8. [s] REQUIRED.
  Velocity_Weight: 0.0

# The optimiser: Adam with a one-cycle learning rate.
Optimiser:
  # The largest learning rate, > 0. Source: F8 Part A's pilots, assumed (owner, 2026-11-17, Q12); kept by F14
  # without tuning (owner, 2026-11-18, Q3). [-] REQUIRED.
  Learning_Rate: 0.002
  # The prefixes per step, >= 1. Source: as Learning_Rate. [-] REQUIRED.
  Batch_Size: 128
  # The epochs at most, >= 1; an epoch holds each training flight once per value of Input.Observed_Samples.
  # Source: 16 epochs of the 35 000 pooled flights, the optimiser steps of 80 epochs of one dataset's 7 000
  # (assumed: owner, 2026-11-17, Q12; the equal steps: owner, 2026-11-18, F8's acceptance). Twice the steps
  # gained 0.14 mm at N = 40 (owner, 2026-11-18, Q3: no tuning; SPEC §4.8). [epochs] REQUIRED.
  Max_Epochs: 16
  # The weight decay, >= 0. Source: 0, F8 Part A's pilots, assumed. [-] REQUIRED.
  Weight_Decay: 0.0

# Early stopping on the simulated validation partition only (SPEC §2.13.7); the weights of the epoch with the
# lowest validation loss are kept.
Early_Stopping:
  # The epochs without an improvement after which the training stops, >= 1. Source: 16, equal to
  # Optimiser.Max_Epochs, so that no training stops before its schedule ends (owner, 2026-11-18, Q2): with 15 of
  # 80 epochs, 12 of F8's 80 trainings stopped in the high-learning-rate phase, 0.5-14.8 mm short (SPEC §4.8).
  # [epochs] REQUIRED.
  Patience: 16
  # The smallest improvement of the validation loss that counts, >= 0. Source: 0.0001, assumed (owner,
  # 2026-11-17, Q12). [m] REQUIRED.
  Min_Delta: 0.0001

# Where the runs go.
Output:
  # The parent folder of the runs; a run is written to Output.Folder/Run.Name. Source: SPEC §9.6. [path]
  # REQUIRED.
  Folder: Data/Generated/Models
