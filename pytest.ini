[pytest]
# importlib: several test_core.py files coexist without __init__.py.
# No -q here: the documented 'pytest -q' and 'pytest --collect-only -q' must still print their totals.
addopts = --import-mode=importlib
# The project's tests.
testpaths = test
markers =
    slow: takes more than about 30 s, or runs a SPEC acceptance at its full size (F6: 1 000-flight datasets, 4-7 s); deselect with -m "not slow"
